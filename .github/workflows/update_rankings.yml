name: Auto Update UFC Fight Cards & Telemetry

on:
  schedule:
    # Runs Tuesday and Friday at 12:00 UTC (fight week preview & weigh-in updates)
    - cron: '0 12 * * 2,5'
  workflow_dispatch:
    # Allows 1-click manual update anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-fight-cards:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Run UFC Fight Cards Updater
        run: python updater.py

      - name: Commit & Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add current_fight_card.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update UFC fight cards & telemetry [skip ci]" && git push)
